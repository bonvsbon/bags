document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ watchBudgets }}\" as=\"g\" hint-placeholder-count=\"2\">\n                <div style=\"background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:center\">\n                    <span style=\"font-size:14.5px;font-weight:600\">{{ g.name }}<\u002Fspan>\n                    <span style=\"{{ g.tagStyle }}\">{{ g.tag }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:9px;border-radius:6px;background:var(--track);margin:12px 0 8px;overflow:hidden\">\n                    <div style=\"{{ g.barStyle }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:var(--muted)\">{{ g.detail }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <!-- recent -->\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px\">\n              <div style=\"font-size:15px;font-weight:700\">รายการล่าสุด<\u002Fdiv>\n              <button onclick=\"{{ goTxns }}\" style=\"font-size:13px;color:#2f7d5b;font-weight:600\">ดูทั้งหมด<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden\">\n              <sc-for list=\"{{ recentTxns }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <div style=\"{{ t.rowStyle }}\">\n                  <div style=\"width:38px;height:38px;border-radius:11px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:16px\">{{ t.icon }}<\u002Fdiv>\n                  <div style=\"flex:1\">\n                    <div style=\"font-size:14.5px;font-weight:600\">{{ t.name }}<\u002Fdiv>\n                    <div style=\"font-size:12px;color:var(--muted);margin-top:    <button onclick=\"{{ goHome }}\" style=\"font-size:15px;color:var(--muted2)\">ยกเลิก<\u002Fbutton>\n              <div style=\"font-size:16px;font-weight:700\">เพิ่มรายการ<\u002Fdiv>\n              <div style=\"width:44px\"><\u002Fdiv>\n            <\u002Fdiv>\n            <!-- segment -->\n            <div style=\"flex:none;padding:18px 20px 0\">\n              <div style=\"display:flex;background:var(--fill2);border-radius:13px;padding:4px;gap:3px\">\n                <button onclick=\"{{ setExpense }}\" style=\"{{ segExpenseStyle }}\">รายจ่าย<\u002Fbutton>\n                <button onclick=\"{{ setIncome }}\" style=\"{{ segIncomeStyle }}\">รายรับ<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <!-- amount -->\n            <div style=\"flex:none;display:flex;align-items:baseline;justify-content:center;gap:8px;padding:34px 0 28px\">\n              <span style=\"font-size:30px;color:#c4c6bc;font-weight:600\">฿<\u002Fspan>\n              <span style=\"{{ amountStyle }}\">{{ addAmountDisplay }}<\u002Fspan>\n            <\u002Fdiv>\n            <!-- categories -->\n            <div class=\"nl-scroll\" style=\"flex:none;padding:0 16px 16px;display:flex;gap:8px;overflow-x:auto\">\n              <sc-for list=\"{{ catChips }}\" as=\"c\" hint-placeholder-count=\"8\">\n                <button onclick=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <!-- account + optional -->\n            <div style=\"flex:none;padding:0 20px;display:flex;flex-direction:column;gap:9px\">\n              <button style=\"width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 15px\">\n                <span style=\"font-size:13px;color:var(--muted)\">จ่ายจาก<\u002Fspan>\n                <span style=\"font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px\">บ onclick=\"{{ goAdd }}\" style=\"height:48px;padding:0 26px;border-radius:14px;background:#2f7d5b;color:#fff;font-size:15px;font-weight:600\">+ เพิ่มรายการแรก<\u002Fbutton>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ txnHasItems }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:20px\">\n              <sc-for list=\"{{ txnGroups }}\" as=\"grp\" hint-placeholder-count=\"3\">\n                <div>\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;padding:0 2px\">\n                    <span style=\"font-size:13px;font-weight:600;color:var(--muted2)\">{{ grp.label }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:#aeb0a6\">{{ grp.sum }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden\">\n                    <sc-for list=\"{{ grp.items }}\" as=\"t\" hint-placeholder-count=\"2\">\n                      <div style=\"{{ t.rowStyle }}\">\n                        <div style=\"width:38px;height:38px;border-radius:11px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:16px\">{{ t.icon }}<\u002Fdiv>\n                        <div style=\"flex:1\">\n                          <div style=\"font-size:14.5px;font-weight:600\">{{ t.name }}<\u002Fdiv>\n                          <div style=\"font-size:12px;color:var(--muted);margin-top:1px\">{{ t.cat }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"{{ t.amountStyle }}\">{{ t.amount }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"text-align:center;font-size:12px;color:#bdbfb5;padding:4px\">ปัดซ้ายที่รายการเพื่อแก้ไขหร {\n  state = {\n    view: 'mobile',        // mobile | web | components\n    screen: 'onboarding',  // onboarding | home | add | transactions | plan | bills | accounts | goals\n    hero: 3,\n    onbStep: 1,            // 1..4, 5 = done\n    payDay: 25,\n    recurring: ['ค่าบ้าน / ค่าเช่า','บัตรเครดิต','Internet'],\n    goalPick: 'มีเงินเหลือปลายเดือน',\n    addType: 'expense',\n    addAmount: 0,\n    addCat: 'อาหาร',\n    addSuccess: false,\n    sheetOpen: false,\n    toast: null,\n    txns: [],\n    txnFilter: 'all',   // all | expense | income | month\n    demoEmpty: false,\n    mode: 'beginner',   // beginner | advanced\n    toggles: { bills:true, budget:true, weekly:false, biometric:true, hideAmounts:false },\n    dark: false,\n  };\n\n  fmt(n){ return '฿' + Math.round(Math.abs(n)).toLocaleString('en-US'); }\n\n  tab(active){\n    return 'padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;transition:.15s;' +\n      (active ? 'background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(40,42,33,0.12)' : 'background:transparent;color:#8a8c82');\n  }\n  chip(active){\n    return 'flex:none;padding:9px 16px;border-radius:11px;font-size:13px;font-weight:600;font-family:inherit;white-space:nowrap;transition:.15s;' +\n      (active ? 'background:#22251f;color:#fff' : 'background:var(--card);color:var(--muted2);border:1px solid #ddd9d0');\n  }\n  miniTab(active){\n    return 'padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;font-family:inherit;' +\n      (active ? 'background:#2f7d5b;color:#fff' : 'background:transparent;color:#8a8c82');\n  }\n\n  go(screen){ this.setState({ screen, addSuccess:false }); }\n\n  renderVals(){\n    const s = this.state;\n    const set = (p)=>()=>this.setState(p);\n\n    // ---- top tabs ----\n    const isMobile = s.view==='mobile', isWeb = s.view==='web', isComponents = s.view==='components';\n\n    // ---- screen chips ----\n    const screenList = [\n      ['onboarding','เริ่มต้นใช้งาน'],['home','หน้าแรก'],['add','เพิ่มรายการ'],\n      ['transactions','รายการ'],['plan','แผนเงิน'],['bills','บิล'],\n      ['accounts','บัญชี'],['goals','เป้าหมาย'],\n    ];\n    const screenTabs = screenList.map(([k,label])=>({\n      label, onClick: ()=>this.go(k), style: this.chip(s.screen===k)\n    }));\n\n    // ---- onboarding ----\n    const onbDots = [1,2,3,4].map(i=>({\n      style:'flex:1;height:5px;border-radius:3px;background:'+((i<=Math.min(s.onbStep,4))?'#2f7d5b':'#e3e0d7')\n    }));\n    const payDays = [1,5,10,15,25,28].map(d=>({\n      label:'ทุกวันที่ '+d, onClick:set({payDay:d}),\n      style:'padding:14px 6px;border-radius:14px;font-size:13.5px;font-weight:600;font-family:inherit;'+\n        (s.payDay===d?'background:#e8f1ec;border:1.5px solid #2f7d5b;color:#2f7d5b':'background:var(--card);border:1px solid #e6e2d9;color:var(--muted2)')\n    }));\n    const recurNames = ['ค่าบ้าน / ค่าเช่า','ค่ารถ','บัตรเครดิต','ค่าโทรศัพท์','Internet','Streaming','อื่น ๆ'];\n    const recurringOptions = recurNames.map(n=>{\n      const on = s.recurring.includes(n);\n      return { label:n, onClick:()=>this.setState(st=>({recurring: on?st.recurring.filter(x=>x!==n):[...st.recurring,n]})),\n        style:'display:flex;align-items:center;justify-content:space-between;text-align:left;padding:15px 14px;border-radius:14px;font-family:inherit;'+\n          (on?'background:#e8f1ec;border:1.5px solid #2f7d5b;color:var(--text)':'background:var(--card);border:1px solid #e6e2d9;color:var(--muted2)'),\n        checkStyle:'width:20px;height:20px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;'+\n          (on?'background:#2f7d5b;color:#fff':'background:#f0ede5;color:transparent;border:1px solid #e0ddd4') };\n    });\n    const goalNames = ['มีเงินเหลือปลายเดือน','เก็บเงิน','ลดหนี้','คุมรายจ่าย','เริ่มลงทุน'];\n    const goalOptions = goalNames.map(n=>{\n      const on = s.goalPick===n;\n      return { label:n, onClick:set({goalPick:n}),\n        style:'display:flex;align-items:center;gap:14px;text-align:left;padding:16px 16px;border-radius:14px;font-family:inherit;'+\n          (on?'background:#e8f1ec;border:1.5px solid #2f7d5b;color:var(--text)':'background:var(--card);border:1px solid #e6e2d9;color:var(--muted2)'),\n        dotStyle:'width:20px;height:20px;border-radius:50%;flex:none;'+\n          (on?'background:#2f7d5b;border:5px solid #cfe3d8':'background:var(--card);border:2px solid #d8d4cb') };\n    });\n    const onbNext = ()=>{\n      if(s.onbStep>=5){ this.setState({view:'mobile',screen:'home'}); return; }\n      this.setState(st=>({onbStep: st.onbStep+1}));\n    };\n    const onbBack = ()=> this.setState(st=>({onbStep: Math.max(1, st.onbStep-1)}));\n    const onbCtaLabel = s.onbStep>=5 ? 'เริ่มใช้งาน' : (s.onbStep===4 ? 'เสร็จสิ้น' : 'ถัดไป');\n\n    // ---- bills ----\n    const upcomingBills = [\n      {icon:'🌐',name:'Internet',due:'อีก 3 วัน',amount:'฿699'},\n      {icon:'💳',name:'บัตรเครดิต',due:'อีก 6 วัน',amount:'฿8,500'},\n      {icon:'🎬',name:'Netflix',due:'อีก 8 วัน',amount:'฿105'},\n    ].map((b,i,a)=>({...b, rowStyle:'display:flex;align-items:center;gap:13px;padding:14px 16px;'+(i<a.length-1?'border-bottom:1px solid var(--divider)':'')}));\n\n    // ---- watch budgets ----\n    const watchBudgets = [\n      {name:'อาหาร',pct:80,tag:'ใกล้ถึงงบที่ตั้งไว้',detail:'ใช้ไป ฿4,800 จาก ฿6,000 · เหลือ ฿1,200',color:'#c98a3c',bg:'#faf3e8'},\n      {name:'ช้อปปิ้ง',pct:90,tag:'ใช้ไปแล้ว 90%',detail:'ใช้ไป ฿1,800 จาก ฿2,000 · เหลือ ฿200',color:'#d9776a',bg:'#fbecea'},\n    ].map(g=>({\n      name:g.name, tag:g.tag, detail:g.detail,\n      tagStyle:'font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:8px;color:'+g.color+';background:'+g.bg,\n      barStyle:'height:100%;width:'+g.pct+'%;border-radius:6px;background:'+g.color\n    }));\n\n    // ---- recent txns (seed + user added) ----\n    const seed = [\n      {icon:'☕',name:'Starbucks',cat:'อาหาร',day:'วันนี้',amt:-145},\n      {icon:'🚗',name:'Grab',cat:'เดินทาง',day:'วันนี้',amt:-119},\n      {icon:'🏪',name:'7-Eleven',cat:'ของใช้',day:'เมื่อวาน',amt:-220},\n      {icon:'💰',name:'เงินเดือน',cat:'รายรับ',day:'25 มิ.ย.',amt:70000},\n    ];\n    const allTxns = [...s.txns, ...seed];\n    const recentTxns = allTxns.slice(0,3).map((t,i,a)=>({\n      icon:t.icon, name:t.name, meta:t.cat+' · '+t.day,\n      amount:(t.amt>=0?'+':'-')+this.fmt(t.amt),\n      amountStyle:'font-size:15px;font-weight:700;color:'+(t.amt>=0?'#3f9d6b':'var(--text)'),\n      rowStyle:'display:flex;align-items:center;gap:13px;padding:14px 16px;'+(i<a.length-1?'border-bottom:1px solid var(--divider)':'')\n    }));\n\n    // ---- transactions screen ----\n    const filterDefs = [['all','ทั้งหมด'],['expense','รายจ่าย'],['income','รายรับ'],['month','เดือนนี้']];\n    const txnFilters = filterDefs.map(([k,label])=>({label,onClick:()=>this.setState({txnFilter:k}),style:this.chip(s.txnFilter===k)}));\n    const filtered = allTxns.filter(t=> s.txnFilter==='expense'? t.amt<0 : s.txnFilter==='income'? t.amt>0 : true);\n    const order = ['วันนี้','เมื่อวาน','25 มิ.ย.'];\n    const txnGroups = order.map(label=>{\n      const items = filtered.filter(t=>t.day===label);\n      if(!items.length) return null;\n      const sum = items.reduce((a,t)=>a+t.amt,0);\n      return { label, sum:(sum>=0?'+':'-')+this.fmt(sum), items: items.map((t,i,a)=>({\n        icon:t.icon, name:t.name, cat:t.cat,\n        amount:(t.amt>=0?'+':'-')+this.fmt(t.amt),\n        amountStyle:'font-size:15px;font-weight:700;color:'+(t.amt>=0?'#3f9d6b':'var(--text)'),\n        rowStyle:'display:flex;align-items:center;gap:13px;padding:14px 16px;'+(i<a.length-1?'border-bottom:1px solid var(--divider)':'')\n      })) };\n    }).filter(Boolean);\n    const txnEmpty = s.demoEmpty;\n    const txnHasItems = !s.demoEmpty && txnGroups.length>0;\n\n    // ---- plan categories ----\n    const planCats = [\n      {icon:'🍜',name:'อาหาร',used:4800,total:6000,color:'#c98a3c',warn:true},\n      {icon:'🚗',name:'เดินทาง',used:1250,total:3000,color:'#2f7d5b',warn:false},\n      {icon:'🛍️',name:'ช้อปปิ้ง',used:1800,total:2000,color:'#d9776a',warn:true},\n      {icon:'🛒',name:'ของใช้',used:900,total:2500,color:'#2f7d5b',warn:false},\n      {icon:'💊',name:'สุขภาพ',used:300,total:1500,color:'#2f7d5b',warn:false},\n    ].map(c=>{const pct=Math.min(100,Math.round(c.used/c.total*100));const left=c.total-c.used;return{\n      icon:c.icon,name:c.name,warn:c.warn,used:this.fmt(c.used),total:this.fmt(c.total),left:this.fmt(left),\n      leftColor:c.warn?'#c98a3c':'#2f7d5b',\n      barStyle:'height:100%;width:'+pct+'%;border-radius:6px;background:'+c.color };});\n\n    // ---- bills timeline ----\n    const billsTimeline = [\n      {date:'23 มิ.ย.',icon:'🎬',name:'Netflix',amt:105,status:'อีก 1 วัน',state:'soon'},\n      {date:'25 มิ.ย.',icon:'🌐',name:'Internet',amt:699,status:'อีก 3 วัน',state:'upcoming'},\n      {date:'30 มิ.ย.',icon:'💳',name:'บัตรเครดิต',amt:8500,status:'อีก 8 วัน',state:'upcoming'},\n      {date:'15 มิ.ย.',icon:'📱',name:'ค่าโทรศัพท์',amt:399,status:'จ่ายแล้ว',state:'paid'},\n    ].map(b=>{\n      const paid=b.state==='paid', soon=b.state==='soon';\n      return {date:b.date,icon:b.icon,name:b.name,amount:this.fmt(b.amt),status:b.status,\n        dotStyle:'width:14px;height:14px;border-radius:50%;border:3px solid var(--bg);background:'+(paid?'#c5c8bf':soon?'#c98a3c':'#2f7d5b'),\n        cardExtra: paid?'opacity:0.62':'',\n        statusStyle:'font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:8px;white-space:nowrap;'+\n          (paid?'background:var(--track);color:var(--muted)':soon?'background:#faf3e8;color:#c98a3c':'background:#e8f1ec;color:#2f7d5b')};\n    });\n\n    // ---- accounts ----\n    const assetRows = [\n      {icon:'🏦',name:'บัญชีหลัก',amt:28500},{icon:'💵',name:'เงินสด',amt:1200},{icon:'📲',name:'e-Wallet',amt:2300},\n    ].map((a,i,arr)=>({icon:a.icon,name:a.name,amount:this.fmt(a.amt),rowStyle:'display:fle
